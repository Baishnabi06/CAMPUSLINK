<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Job Details - CampusLink</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>

<body>

    <div class="dashboard-container">

        <main class="main-content">

            <div class="card">

                <h1 id="jobDetailsTitle">Job Details</h1>

                <h3 id="jobDetailsCompany">Company not specified</h3>

                <p>
                    <strong>Match:</strong>
                    <span id="jobDetailsMatch">-</span>
                </p>

                <p>
                    <strong>Location:</strong>
                    <span id="jobDetailsLocation">-</span>
                </p>

                <p>
                    <strong>CTC:</strong>
                    <span id="jobDetailsCtc">-</span>
                </p>

                <p>
                    <strong>Mode:</strong>
                    <span id="jobDetailsMode">-</span>
                </p>

               

                <hr>

                <h3>Required Skills</h3>
                <p id="jobDetailsSkills">-</p>

                <h3>Job Description</h3>
                <p id="jobDetailsDescription">-</p>

                <br>

                <button type="button" onclick="history.back()">
                    ← Back to Dashboard
                </button>

            </div>

        </main>

    </div>

    <script>

        const rawJob = sessionStorage.getItem("selectedRecommendedJob");

        if (rawJob) {

            try {

                const job = JSON.parse(rawJob);

                // Job Title
                document.getElementById("jobDetailsTitle").textContent =
                    job.job_title || "Job Details";

                // Company
                document.getElementById("jobDetailsCompany").textContent =
                    job.company_name || "Company not specified";

                // Match Score
                document.getElementById("jobDetailsMatch").textContent =
                    job.match_score != null
                        ? job.match_score + "% Match"
                        : "Not specified";

                // Location
                document.getElementById("jobDetailsLocation").textContent =
                    job.location || "Not specified";

                // CTC
                document.getElementById("jobDetailsCtc").textContent =
                    job.ctc != null
                        ? job.ctc
                        : "Not specified";

                // Mode
                document.getElementById("jobDetailsMode").textContent =
                    job.mode || "Not specified";

                // Application Deadline
                

                // Required Skills
                document.getElementById("jobDetailsSkills").textContent =
                    Array.isArray(job.required_skills)
                        ? job.required_skills.join(", ")
                        : job.required_skills || "Not specified";

                // Job Description
                document.getElementById("jobDetailsDescription").textContent =
                    job.job_description || "No description available.";

            } catch (error) {

                console.error("Error loading job details:", error);

                document.getElementById("jobDetailsTitle").textContent =
                    "Job Details Error";

                document.getElementById("jobDetailsDescription").textContent =
                    "Unable to load job details.";

            }

        } else {

            document.getElementById("jobDetailsTitle").textContent =
                "Job Not Found";

            document.getElementById("jobDetailsCompany").textContent =
                "Company not specified";

            document.getElementById("jobDetailsDescription").textContent =
                "No job details were found.";

        }

    </script>

</body>
</html>
