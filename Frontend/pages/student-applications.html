<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CampusLink — My Applications</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
</head>
<body>
  <div class="app-shell" id="app-shell"></div>

  <div id="page-content" style="display: none;">
    <h2>My Applications</h2>
    <div class="card">
      <div id="applicationsList">Loading...</div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <script>
    const user = requireAuth(["student"]);
    if (user) {
      renderShell(user, "student-applications.html");
      loadApplications();
    }

    async function loadApplications() {
      const listEl = document.getElementById("applicationsList");
      try {
        const res = await apiFetch("/api/applications/mine");
        const apps = res.data;

        if (apps.length === 0) {
          listEl.innerHTML = "<p>You haven't applied to any drives yet.</p>";
          return;
        }

        listEl.innerHTML = apps
          .map(
            (a) => `
            <div class="drive-item">
              <div>
                <strong>${a.drive?.job_title || "Unknown role"}</strong>
                at ${a.drive?.company_name || "Unknown company"}
                — CTC ${a.drive?.ctc ?? "-"} LPA
                <br />
                <span style="color:#6b7280; font-size:0.85rem;">
                  Applied on ${new Date(a.applied_at).toLocaleDateString()}
                </span>
              </div>
              <span class="badge">${a.status}</span>
            </div>`
          )
          .join("");
      } catch (err) {
        listEl.textContent = "Failed to load applications: " + err.message;
      }
    }
  </script>
</body>
</html>
