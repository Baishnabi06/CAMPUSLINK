<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CampusLink — Login</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <h2>Login to CampusLink</h2>

      <div class="auth-tabs">
        <button type="button" id="tabPassword" class="tab active">Password</button>
        <button type="button" id="tabOtp" class="tab">Email code</button>
      </div>

      <div id="authError" class="auth-error"></div>
      <div id="authInfo" class="auth-info"></div>

      <!-- Tab 1: password login (unchanged) -->
      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required />
        </div>
        <button type="submit">Login</button>
      </form>

      <!-- Tab 2: email code (OTP) login -->
      <form id="otpForm" hidden>
        <div id="otpEmailStep">
          <div class="form-group">
            <label for="otpEmail">Email</label>
            <input type="email" id="otpEmail" required />
          </div>
          <button type="submit">Send code</button>
        </div>

        <div id="otpCodeStep" hidden>
          <div class="form-group">
            <label for="otpCode">6-digit code</label>
            <input type="text" id="otpCode" inputmode="numeric" maxlength="6"
                   autocomplete="one-time-code" />
          </div>
          <button type="submit">Verify and log in</button>
          <button type="button" id="resendOtpBtn">Resend code</button>
        </div>
      </form>

      <div class="auth-switch">
        Don't have an account? <a href="register.html">Register</a>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    initLoginForm();
    initOtpLogin();
  </script>
</body>
</html>
