<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Gap Analysis — HunarLoop</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <script src="../js/icons.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/layout.js"></script>
    <style>
        /* ── Layout ── */
        .sga-wrap      { max-width: 960px; margin: 0 auto; }
        .sga-card      { background: var(--bg-surface,#fff); border: 1px solid var(--border-color,#e5e7eb); border-radius: 14px; padding: 24px; margin-bottom: 20px; }

        /* ── Role pills ── */
        .role-pills    { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
        .role-pill {
            padding: 8px 18px; border-radius: 20px; border: 2px solid var(--border-color,#e5e7eb);
            background: transparent; cursor: pointer; font-weight: 600; font-size: 0.9em;
            color: var(--text-secondary,#6b7280); transition: all .2s;
        }
        .role-pill:hover  { border-color: #2563eb; color: #2563eb; }
        .role-pill.active { background: #2563eb; color: #fff; border-color: #2563eb; }

        /* ── Match bar ── */
        .match-hero { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; margin-bottom: 20px; }
        .match-pct  { font-size: 3.6em; font-weight: 800; line-height: 1; color: #2563eb; }
        .match-bar-wrap { flex: 1; min-width: 180px; }
        .match-bar  { height: 14px; background: var(--border-color,#e5e7eb); border-radius: 7px; overflow: hidden; margin: 10px 0; }
        .match-bar-fill { height: 100%; background: linear-gradient(90deg,#10b981,#2563eb); transition: width .6s ease; border-radius: 7px; }

        /* ── Severity badge ── */
        .sev-badge { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 20px; font-weight: 700; font-size: .9em; margin-top: 4px; }
        .sev-low      { background: rgba(16,185,129,.12); color: #059669; border: 1px solid #059669; }
        .sev-medium   { background: rgba(234,179,8,.12);  color: #b45309; border: 1px solid #b45309; }
        .sev-high     { background: rgba(249,115,22,.12); color: #c2410c; border: 1px solid #c2410c; }
        .sev-critical { background: rgba(220,38,38,.12);  color: #b91c1c; border: 1px solid #b91c1c; }

        /* ── Stats grid ── */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(130px,1fr)); gap: 14px; margin-top: 20px; }
        .stat-box   { background: var(--bg-surface-alt,#f1f5f9); border-radius: 10px; padding: 16px; text-align: center; border: 1px solid var(--border-color,#e5e7eb); }
        .stat-val   { font-size: 2em; font-weight: 800; color: #2563eb; line-height: 1; }
        .stat-lbl   { font-size: .82em; color: var(--text-muted,#9ca3af); margin-top: 6px; font-weight: 500; }

        /* ── Tabs ── */
        .tabs       { display: flex; gap: 4px; border-bottom: 2px solid var(--border-color,#e5e7eb); margin-bottom: 20px; flex-wrap: wrap; }
        .tab-btn    { padding: 11px 18px; border: none; background: transparent; cursor: pointer; font-weight: 600; font-size: .93em; color: var(--text-muted,#9ca3af); border-bottom: 3px solid transparent; margin-bottom: -2px; transition: all .2s; }
        .tab-btn:hover  { color: var(--text-primary,#111); }
        .tab-btn.active { color: #2563eb; border-bottom-color: #2563eb; }
        .tab-pane   { display: none; }
        .tab-pane.active { display: block; }

        /* ── Skill badges (matched) ── */
        .skill-badges { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .skill-badge  { display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 20px; font-weight: 600; font-size: .88em; }
        .badge-green  { background: rgba(16,185,129,.12); color: #059669; border: 1px solid #059669; }

        /* ── Missing skill cards ── */
        .missing-list   { display: grid; gap: 18px; margin-top: 10px; }
        .missing-card   {
            border: 1px solid var(--border-color,#e5e7eb); border-radius: 12px;
            padding: 20px; background: var(--bg-surface,#fff);
            border-left: 5px solid #f97316;
        }
        .missing-card-head { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 10px; }
        .missing-name  { font-size: 1.1em; font-weight: 700; color: var(--text-primary,#111); }
        .missing-cat   { font-size: .82em; color: var(--text-muted,#9ca3af); margin-top: 3px; }
        .time-badge    { background: #fff7ed; color: #c2410c; border: 1px solid #f97316; border-radius: 8px; padding: 5px 12px; font-size: .82em; font-weight: 700; white-space: nowrap; }

        /* ── Resource buttons ── */
        .resource-list  { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
        .res-btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 7px 13px; border-radius: 8px; font-size: .83em; font-weight: 600;
            text-decoration: none; cursor: pointer; transition: all .2s;
            border: 1.5px solid;
        }
        .res-tutorial { background: #eff6ff; color: #1d4ed8; border-color: #93c5fd; }
        .res-tutorial:hover { background: #1d4ed8; color: #fff; }
        .res-video    { background: #fff1f2; color: #be123c; border-color: #fda4af; }
        .res-video:hover { background: #be123c; color: #fff; }
        .res-practice { background: #f0fdf4; color: #15803d; border-color: #86efac; }
        .res-practice:hover { background: #15803d; color: #fff; }
        .res-course   { background: #faf5ff; color: #7e22ce; border-color: #d8b4fe; }
        .res-course:hover { background: #7e22ce; color: #fff; }
        .res-docs     { background: #f0f9ff; color: #0369a1; border-color: #7dd3fc; }
        .res-docs:hover { background: #0369a1; color: #fff; }

        /* ── Spinner / error ── */
        .sga-loading { display: flex; align-items: center; gap: 12px; padding: 30px; color: var(--text-muted,#9ca3af); }
        .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid var(--border-color,#e5e7eb); border-top-color: #2563eb; border-radius: 50%; animation: spin .7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .sga-error { background: #fef2f2; border: 1px solid #fca5a5; border-radius: 10px; padding: 16px; color: #b91c1c; margin-top: 10px; }

        /* ── Empty state ── */
        .sga-empty { text-align: center; padding: 40px 20px; color: var(--text-muted,#9ca3af); }
        .sga-empty a { color: #2563eb; font-weight: 600; }

        /* ── Back button ── */
        .back-btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 20px; border: 1.5px solid var(--border-color,#e5e7eb); border-radius: 8px; background: var(--bg-surface,#fff); color: var(--text-primary,#111); font-weight: 600; text-decoration: none; transition: all .2s; margin-top: 8px; }
        .back-btn:hover { background: #2563eb; color: #fff; border-color: #2563eb; }

        @media (max-width: 600px) {
            .match-pct { font-size: 2.6em; }
            .sga-card  { padding: 16px; }
            .tab-btn   { padding: 9px 12px; font-size: .85em; }
        }
    </style>
</head>
<body>

<div class="app-shell" id="app-shell"></div>

<div id="page-content" style="display:none;">
    <div class="page-shell">
        <header class="dashboard-header">
            <div>
                <h2>Skill Gap Analysis</h2>
                <p class="welcome-subtitle">See what skills you need and where to learn them — all free.</p>
            </div>
        </header>

        <div class="sga-wrap">

            <!-- Role selector -->
            <div class="sga-card">
                <h3 style="margin:0 0 4px;">Select Target Role</h3>
                <p style="color:var(--text-muted,#9ca3af);margin:0 0 4px;font-size:.9em;">Your profile skills will be compared against the role requirements.</p>
                <div class="role-pills" id="rolePills">
                    <div class="sga-loading"><span class="spinner"></span> Loading roles…</div>
                </div>
            </div>

            <!-- Main result -->
            <div class="sga-card" id="resultCard">
                <div class="sga-loading"><span class="spinner"></span> Analyzing your skills…</div>
            </div>

            <!-- Tabs -->
            <div class="sga-card" id="tabCard" style="display:none;">
                <div class="tabs">
                    <button class="tab-btn active" onclick="switchTab('matched',this)">✅ Skills You Have</button>
                    <button class="tab-btn"         onclick="switchTab('missing',this)">📚 Skills to Learn</button>
                </div>

                <div id="matched" class="tab-pane active">
                    <div id="matchedContent"></div>
                </div>
                <div id="missing" class="tab-pane">
                    <div id="missingContent"></div>
                </div>
            </div>

            <!-- Back -->
            <a href="student-dashboard.html" class="back-btn">← Back to Dashboard</a>
        </div>
    </div>
</div>

<script>
const user = requireAuth(["student"]);
let studentSkills = [];
let availableRoles = [];

if (user) {
    renderShell(user, "student-dashboard.html");
    init();
}

async function init() {
    try {
        // Load profile and roles in parallel
        const [profileRes, rolesRes] = await Promise.all([
            apiFetch("/api/students/me"),
            apiFetch("/api/skill-gap/roles"),
        ]);

        const profile = profileRes.data;
        availableRoles = rolesRes.data || [];

        // Normalize skills — handle string or array
        let raw = profile.skills || [];
        if (typeof raw === "string") {
            raw = raw.split(",").map(s => s.trim()).filter(Boolean);
        }
        studentSkills = raw;

        if (studentSkills.length === 0) {
            document.getElementById("resultCard").innerHTML = `
                <div class="sga-empty">
                    <div style="font-size:2.5em;margin-bottom:12px;">📋</div>
                    <p>You haven't added any skills yet.</p>
                    <a href="profile.html">Go to Profile → add your skills</a>
                </div>`;
            document.getElementById("rolePills").innerHTML = "";
            return;
        }

        renderRolePills(availableRoles);

        // Auto-analyze first role
        if (availableRoles.length > 0) {
            await analyze(availableRoles[0]);
        }

    } catch (err) {
        console.error(err);
        document.getElementById("resultCard").innerHTML =
            `<div class="sga-error">Failed to load data. Please refresh and try again.</div>`;
    }
}

function renderRolePills(roles) {
    document.getElementById("rolePills").innerHTML = roles.map((r, i) => `
        <button class="role-pill ${i === 0 ? "active" : ""}"
                onclick="selectRole(this, '${r}')">${capitalize(r)}</button>
    `).join("");
}

async function selectRole(btn, role) {
    document.querySelectorAll(".role-pill").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    await analyze(role);
}

async function analyze(role) {
    document.getElementById("resultCard").innerHTML =
        `<div class="sga-loading"><span class="spinner"></span> Analyzing for <strong>${capitalize(role)}</strong>…</div>`;
    document.getElementById("tabCard").style.display = "none";

    try {
        const res = await apiFetch("/api/skill-gap/analyze", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ student_skills: studentSkills, target_role: role }),
        });

        renderResult(res.data);
    } catch (err) {
        document.getElementById("resultCard").innerHTML =
            `<div class="sga-error">Analysis failed: ${err.message}</div>`;
    }
}

function renderResult(d) {
    const sevClass = { low: "sev-low", medium: "sev-medium", high: "sev-high", critical: "sev-critical" };
    const sevIcon  = { low: "✅", medium: "🟡", high: "🟠", critical: "🔴" };

    // ── Overview card ──
    document.getElementById("resultCard").innerHTML = `
        <div class="match-hero">
            <div class="match-pct">${d.match_percentage}%</div>
            <div class="match-bar-wrap">
                <div style="font-size:1.15em;font-weight:700;">${capitalize(d.target_role)}</div>
                <div class="match-bar">
                    <div class="match-bar-fill" style="width:${d.match_percentage}%"></div>
                </div>
                <div class="sev-badge ${sevClass[d.severity] || "sev-high"}">
                    ${sevIcon[d.severity] || "⚠"} ${d.severity_label}
                </div>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-box"><div class="stat-val">${d.matched_count}</div><div class="stat-lbl">Skills Matched</div></div>
            <div class="stat-box"><div class="stat-val">${d.missing_count}</div><div class="stat-lbl">Skills to Learn</div></div>
            <div class="stat-box"><div class="stat-val">${d.total_required_skills}</div><div class="stat-lbl">Total Required</div></div>
            <div class="stat-box"><div class="stat-val">${d.estimated_weeks}w</div><div class="stat-lbl">Est. Study Time</div></div>
        </div>
    `;

    // ── Matched skills tab ──
    if (d.matched_skills.length > 0) {
        document.getElementById("matchedContent").innerHTML = `
            <p style="color:var(--text-muted,#9ca3af);margin-bottom:6px;">
                You already have <strong>${d.matched_count}</strong> of the required skills. 
            </p>
            <div class="skill-badges">
                ${d.matched_skills.map(s => `
                    <div class="skill-badge badge-green">✓ ${esc(s.name)}</div>
                `).join("")}
            </div>`;
    } else {
        document.getElementById("matchedContent").innerHTML =
            `<p style="color:var(--text-muted,#9ca3af);">No matched skills yet. Start with the learning resources below!</p>`;
    }

    // ── Missing skills tab ──
    if (d.missing_skills.length > 0) {
        document.getElementById("missingContent").innerHTML = `
            <p style="color:var(--text-muted,#9ca3af);margin-bottom:14px;">
                Learn these <strong>${d.missing_count}</strong> skills to become job-ready.
                Click any button to start learning — all resources are <strong>free</strong>.
            </p>
            <div class="missing-list">
                ${d.missing_skills.map(s => `
                    <div class="missing-card">
                        <div class="missing-card-head">
                            <div>
                                <div class="missing-name">${esc(s.name)}</div>
                                <div class="missing-cat">${esc(s.category)}</div>
                            </div>
                            <div class="time-badge">⏱ ~${s.learning_hours}h · ${s.learning_weeks} week${s.learning_weeks > 1 ? "s" : ""}</div>
                        </div>
                        <div class="resource-list">
                            ${s.resources.map(r => `
                                <a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer"
                                   class="res-btn res-${r.type}">
                                    ${r.icon} ${esc(r.name)}
                                </a>
                            `).join("")}
                        </div>
                    </div>
                `).join("")}
            </div>`;
    } else {
        document.getElementById("missingContent").innerHTML = `
            <div class="sga-empty">
                <div style="font-size:2.5em;margin-bottom:8px;">🎉</div>
                <p>You have all required skills for this role!</p>
            </div>`;
    }

    document.getElementById("tabCard").style.display = "block";
}

function switchTab(id, btn) {
    document.querySelectorAll(".tab-pane").forEach(p => p.classList.remove("active"));
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.getElementById(id).classList.add("active");
    btn.classList.add("active");
}

function capitalize(s) {
    return s ? s.charAt(0).toUpperCase() + s.slice(1) : "";
}

function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, c =>
        ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
</script>

</body>
</html>
