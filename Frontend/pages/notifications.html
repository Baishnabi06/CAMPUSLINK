<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HunarLoop — Notifications</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
</head>
<body>
  <div class="app-shell" id="app-shell"></div>

  <div id="page-content" style="display: none;">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h2>Notifications</h2>
      <button id="markAllReadBtn">Mark All as Read</button>
    </div>
    <div class="card" id="notificationsList">Loading...</div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <script>
    const user = requireAuth([]);
    if (user) {
      renderShell(user, "notifications.html");
      loadNotifications();
    }

    async function loadNotifications() {
      const listEl = document.getElementById("notificationsList");
      try {
        const res = await apiFetch("/api/notifications/mine");
        const notifications = res.data;

        if (notifications.length === 0) {
          listEl.innerHTML = "<p>No notifications yet.</p>";
          return;
        }

        listEl.innerHTML = notifications
          .map(
            (n) => `
            <div class="drive-item" style="background: ${n.is_read ? "transparent" : "#eff6ff"};"
                 onclick="markRead('${n.id}')">
              <div>
                <strong>${n.title}</strong>
                <br />
                <span style="color:#6b7280; font-size:0.9rem;">${n.message}</span>
                <br />
                <span style="color:#9ca3af; font-size:0.75rem;">
                  ${new Date(n.created_at).toLocaleString()}
                </span>
              </div>
            </div>`
          )
          .join("");
      } catch (err) {
        listEl.textContent = "Failed to load notifications: " + err.message;
      }
    }

    async function markRead(id) {
      try {
        await apiFetch(`/api/notifications/${id}/read`, { method: "PATCH" });
        loadNotifications();
        loadUnreadBadge();
      } catch (err) {
        // Non-fatal
      }
    }

    document.getElementById("markAllReadBtn").addEventListener("click", async () => {
      try {
        await apiFetch("/api/notifications/read-all", { method: "PATCH" });
        loadNotifications();
        loadUnreadBadge();
      } catch (err) {
        alert("Failed: " + err.message);
      }
    });
  </script>
</body>
</html>
