<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HunarLoop — Monitor Applications</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
</head>
<body>
  <div class="app-shell" id="app-shell"></div>

  <div id="page-content" style="display: none;">
    <h2>Monitor Applications</h2>
    <div class="card">
      <div id="applicationsList">Loading...</div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/layout.js"></script>
  <script>
    const user = requireAuth(["placement_officer"]);
    if (user) {
      renderShell(user, "officer-applications.html");
      loadAllApplications();
    }

    async function loadAllApplications() {
      const listEl = document.getElementById("applicationsList");
      try {
        const res = await apiFetch("/api/applications/all");
        const apps = res.data;

        if (apps.length === 0) {
          listEl.innerHTML = "<p>No applications in the system yet.</p>";
          return;
        }

        listEl.innerHTML = apps
          .map(
            (a) => `
            <div class="drive-item">
              <div>
                <strong>${a.student_name}</strong> applied to
                <strong>${a.drive_title}</strong> at ${a.company_name}
                <br />
                <span style="color:#6b7280; font-size:0.85rem;">
                  Applied on ${new Date(a.applied_at).toLocaleDateString()}
                </span>
              </div>
              <span class="badge">${a.status}</span>
            </div>`
          )
          .join("");
      } catch (err) {
        listEl.textContent = "Failed to load applications: " + err.message;
      }
    }
  </script>
</body>
</html>
